name: BIST v2 Kapanis Taramasi + Ogrenme

on:
  schedule:
    # Hafta ici 18:45 Turkiye saati (UTC 15:45). Seans 18:00'de kapanir, Yahoo verisi ~15 dk gecikmeli.
    - cron: '45 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-v2-pipeline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kapanis Taramasi (panel + skor + portfoy + defter)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: Europe/Istanbul
        run: python main.py

      - name: Ogrenme Denetimi (walk-forward + terfi/rollback)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: Europe/Istanbul
        run: python shock_auditor.py

      - name: Kaydet
        run: |
          git config --global user.name "QuantBot-BIST"
          git config --global user.email "bot@bist.local"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "⚡ v2 kapanis taramasi + ogrenme"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
