name: BIST Morning Scan & Exit Engine

on:
  schedule:
    # Hafta içi her gün TSİ 10:30 (UTC 07:30)
    - cron: '45 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: pip install -r requirements.txt

      - name: BIST Taramasini ve Cikis Motorunu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Defteri ve Taramayi Otomatik Kaydet
        run: |
          git config --global user.name "QuantBot-BIST"
          git config --global user.email "bot@bist.local"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "⚡ Auto-Update: BIST 10:30 Scan & Ledger" && git push)
