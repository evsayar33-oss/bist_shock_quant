name: BIST Morning Scan & Exit Engine

on:
  schedule:
    # Hafta içi her gün 10:35 Türkiye saati
    - cron: '40 5 * * 1-5'
      timezone: 'Europe/Istanbul'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: BIST Taramasini ve Cikis Motorunu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: Europe/Istanbul
        run: |
          echo "========================================"
          echo "BIST DAILY SCAN"
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "TR  : $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"
          python main.py

      - name: Defteri ve Taramayi Otomatik Kaydet
        run: |
          git config --global user.name "QuantBot-BIST"
          git config --global user.email "bot@bist.local"
          git add -A
          git diff-index --quiet HEAD || (
            git commit -m "⚡ Auto-Update: BIST 10:35 Scan & Ledger"
            git push
          )
