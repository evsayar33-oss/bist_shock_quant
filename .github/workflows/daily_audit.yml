name: BIST v2 Haftalik Tam Veri Yenileme

# Cumartesi: 3 yillik paneli ve makro serileri bastan indirir (bolunme/duzeltme temizligi),
# ardindan ogrenme denetimini tam veriyle yeniden calistirir.
# Ilk kurulumdan sonra bunu Actions sekmesinden bir kez elle calistirmaniz onerilir.

on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-v2-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tam Backfill (3 yil)
        env:
          TZ: Europe/Istanbul
        run: python bist_history.py --full

      - name: Ogrenme Denetimi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: Europe/Istanbul
        run: python shock_auditor.py

      - name: Kaydet
        run: |
          git config --global user.name "QuantBot-BIST"
          git config --global user.email "bot@bist.local"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "📥 v2 haftalik veri yenileme"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
