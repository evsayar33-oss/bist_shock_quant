name: BIST Evening Audit & Auto-Calibration

on:
  schedule:
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: pip install -r requirements.txt

      - name: Denetimi ve Otonom Ogrenmeyi Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python shock_auditor.py

      - name: Yeni Parametreleri ve Defteri Repoya Otomatik Kaydet
        run: |
          git config --global user.name "QuantBot Auto-Learning"
          git config --global user.email "bot@quant.local"
          git add shock_ai_state.json backtest_ledger.csv gecmis_veri.csv shock_signals_log.csv
          git diff-index --quiet HEAD || (git commit -m "🤖 Auto-Calibration: Updated AI state & Backtest Ledger" && git push)
